{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow-sm" style="width: 60px; height: 60px;">
                <i class="bi bi-lock-fill fs-3"></i>
            </div>
            <h3 class="fw-bold">Login Admin</h3>
            <p class="text-muted small">Masuk untuk mengelola tiket bantuan</p>
        </div>
        
        <div class="glass-card p-4 p-md-4">
            <form action="/login" method="POST">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control bg-light border-0" id="usernameInput" name="username" required placeholder="Username">
                    <label for="usernameInput" class="text-muted"><i class="bi bi-person me-2"></i>Username</label>
                </div>
                
                <div class="form-floating mb-4">
                    <input type="password" class="form-control bg-light border-0" id="passwordInput" name="password" required placeholder="Password">
                    <label for="passwordInput" class="text-muted"><i class="bi bi-key me-2"></i>Password</label>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-medium shadow-sm">
                        Masuk Dashboard
                    </button>
                </div>
            </form>
        </div>
        
        <div class="text-center mt-4">
            <a href="/" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left me-1"></i> Kembali ke Halaman Publik</a>
        </div>
    </div>
</div>
{% endblock %}
